[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
astral-tokio-tar = "0.7"
tokio-stream = "0.1"
dioxus = { version = "0.7" }
clap = "4.6"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
text-size = "1.1"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2"
enum_dispatch = "0.3"
dirs = "7"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
